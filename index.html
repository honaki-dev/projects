<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="icon"
            type="image/x-icon"
            href="https://honaki.is-a.dev/favicon.ico"
        />
        <title>Honaki's Projects</title>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss-browser/4.3.3/index.global.min.js"
            integrity="sha512-hULGJIctuLmo0B/LLdCfni+smSwvSag6ZyCEVnJuX5lDBuxZMhCLZQ3kgN+d0ZP4Uu/VMYDKksb7m+7YpOhwfg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/js/all.min.js"
            integrity="sha512-2+f4MxT8KwN4tUzw6/hv9kxKiix603S9kmBcix+0y0dBhd6zdaPOV1Thf1DM886pFZG+cAtmshBi8UBpo6m3JA=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
    </head>
    <body
        class="bg-slate-50 antialiased text-slate-600 select-none transition-colors duration-300 dark:bg-slate-950 dark:text-slate-300"
    >
        <div class="max-w-[1200px] w-full md:mx-auto py-10 px-4">
            <h1
                class="text-4xl text-center mb-10 font-bold text-slate-900 dark:text-white"
            >
                My projects here~
            </h1>

            <div
                id="projectList"
                class="grid md:grid-cols-2 grid-cols-1 gap-5"
            ></div>
        </div>
        <script>
            !(async function () {
                const data = await fetch("/data.json").then((r) => r.json());
                const projectList = document.getElementById("projectList");
                (data ?? []).forEach((p) => {
                    projectList.innerHTML += `<div
                    class="group bg-white border border-slate-200 shadow-sm rounded-3xl p-4 transition-all hover:shadow-md hover:border-slate-300 dark:bg-slate-900 dark:border-slate-800 dark:hover:border-slate-700"
                >
                    <div class="overflow-hidden rounded-lg">
                        <img
                            class="aspect-video group-hover:scale-110 transition-transform duration-300"
                            draggable="false"
                            src="images/${p.image}"
                            alt="Aov preview"
                        />
                    </div>
                    <h3
                        class="mt-4 text-lg font-semibold text-slate-800 dark:text-slate-100"
                    >
                        ${p.name}
                    </h3>
                    <div class="flex gap-3 mt-4">
                        <a
                            href="${p.redirect}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="flex-1 flex items-center justify-center gap-2 px-4 py-2 rounded-full bg-slate-100 text-slate-700 text-sm font-medium transition-colors hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700"
                        >
                            <i class="fa-solid fa-globe"></i>
                            Go to site
                        </a>
                        <a
                            href="${p.github}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="flex-1 flex items-center justify-center gap-2 px-4 py-2 rounded-full bg-slate-900 text-white text-sm font-medium transition-colors hover:bg-slate-800 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-slate-300"
                        >
                            <i class="fa-brands fa-github text-lg"></i>
                            Source code
                        </a>
                    </div>
                </div>`.trim();
                });
            })();
        </script>
    </body>
</html>
